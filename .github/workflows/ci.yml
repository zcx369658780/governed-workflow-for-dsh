name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check tracked lib matches canonical build (fail-closed)
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- lib)" ]; then
            echo "prebuilt lib drifted from canonical build:" >&2
            git status --porcelain --untracked-files=all -- lib >&2
            exit 1
          fi
